name: CI

on:
  push:
    branches: ['**']
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: check (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['20.19', '22']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run typecheck:test
      - run: npm run typecheck:server
      - run: npm run lint
      - run: npm run check-readme-claims
      - run: npm run check-encoding
        continue-on-error: true # blocking from F2 (mojibake is fixed there)
      - run: npm run knip
      - run: npm run test:coverage
      - run: npm run build
      - run: npm run build:server
      - run: npm run metrics
      - uses: actions/upload-artifact@v4
        if: matrix.node == '22'
        with:
          name: metrics
          path: metrics.json

  e2e:
    name: e2e (chromium)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
        env:
          CI: 'true'
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
